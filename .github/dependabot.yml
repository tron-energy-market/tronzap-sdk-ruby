version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The SDK's own dependency: raising it raises the minimum for every consumer.
      - dependency-name: bigdecimal
    groups:
      development-dependencies:
        patterns: ['*']
    commit-message:
      prefix: chore
